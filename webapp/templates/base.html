<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Skin Cancer Awareness{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('home') }}">
    <svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 9c-4-3-6-8-3-8s5 4 5 8l-6 16m6-16c4-3 6-8 3-8s-5 4-5 8l6 16"/></svg>
    Skin Cancer Awareness
  </a>
  <nav>
    <a href="{{ url_for('learn') }}">More about Skin Cancer</a>
    <a href="{{ url_for('contact') }}">Contact Us</a>

</header>
<main>{% block content %}{% endblock %}</main>
<footer>{{ disclaimer }}</footer>
{% block scripts %}{% endblock %}

</html>
